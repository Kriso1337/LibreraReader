&lt;div id=&quot;librera-redesign&quot; class=&quot;viz-carousel viz-dotted-background&quot; aria-label=&quot;Варианты редизайна Librera&quot; data-previous-label=&quot;Предыдущий вариант&quot; data-next-label=&quot;Следующий вариант&quot;&gt;
  &lt;section data-variant=&quot;Книжная полка&quot; aria-label=&quot;Книжная полка&quot;&gt;
    &lt;div class=&quot;lr-stage&quot;&gt;&lt;div id=&quot;lr-shelf&quot; class=&quot;lr-phone&quot; aria-label=&quot;Librera — книжная полка&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;section data-variant=&quot;Компактный каталог&quot; aria-label=&quot;Компактный каталог&quot; hidden&gt;
    &lt;div class=&quot;lr-stage&quot;&gt;&lt;div id=&quot;lr-compact&quot; class=&quot;lr-phone&quot; aria-label=&quot;Librera — компактный каталог&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;librera-redesign&#x27;);
  const books = [
    {id:&#x27;nights&#x27;,title:&#x27;Белые ночи&#x27;,author:&#x27;Фёдор Достоевский&#x27;,coverAuthor:&#x27;ФЁДОР\nДОСТОЕВСКИЙ&#x27;,genre:&#x27;Романы&#x27;,year:&#x27;1848&#x27;,size:&#x27;0,8&#x27;,bg:&#x27;#294938&#x27;,ink:&#x27;#e9e4c9&#x27;,summary:&#x27;Четыре петербургские ночи, случайная встреча и история мечтателя, который впервые решается выйти из своего одиночества.&#x27;,text:[&#x27;Была чудная ночь, такая ночь, которая разве только и может быть тогда, когда мы молоды, любезный читатель.&#x27;,&#x27;Небо было такое звёздное, такое светлое небо, что, взглянув на него, невольно нужно было спросить себя: неужели же могут жить под таким небом разные сердитые и капризные люди?&#x27;]},
    {id:&#x27;captain&#x27;,title:&#x27;Капитанская дочка&#x27;,author:&#x27;Александр Пушкин&#x27;,coverAuthor:&#x27;АЛЕКСАНДР\nПУШКИН&#x27;,genre:&#x27;Романы&#x27;,year:&#x27;1836&#x27;,size:&#x27;1,2&#x27;,bg:&#x27;#d9b78c&#x27;,ink:&#x27;#443e30&#x27;,summary:&#x27;Пётр Гринёв отправляется на службу в далёкую крепость. История взросления, любви и верности себе на фоне большого восстания.&#x27;,text:[&#x27;Отец мой Андрей Петрович Гринёв в молодости своей служил при графе Минихе и вышел в отставку премьер-майором в 17… году.&#x27;,&#x27;С тех пор жил он в своей Симбирской деревне, где и женился на девице Авдотье Васильевне Ю., дочери бедного тамошнего дворянина.&#x27;]},
    {id:&#x27;ward&#x27;,title:&#x27;Палата № 6&#x27;,author:&#x27;Антон Чехов&#x27;,coverAuthor:&#x27;АНТОН\nЧЕХОВ&#x27;,genre:&#x27;Рассказы&#x27;,year:&#x27;1892&#x27;,size:&#x27;0,4&#x27;,bg:&#x27;#b3c4c1&#x27;,ink:&#x27;#243c3c&#x27;,summary:&#x27;Врач Андрей Ефимыч находит собеседника там, где меньше всего ожидал. Небольшая повесть о достоинстве, равнодушии и границах свободы.&#x27;,text:[&#x27;В больничном дворе стоит небольшой флигель, окружённый целым лесом репейника, крапивы и дикой конопли.&#x27;,&#x27;Крыша на нём ржавая, труба наполовину обвалилась, ступеньки у крыльца сгнили и поросли травой, а от штукатурки остались только следы.&#x27;]},
    {id:&#x27;oblomov&#x27;,title:&#x27;Обломов&#x27;,author:&#x27;Иван Гончаров&#x27;,coverAuthor:&#x27;ИВАН\nГОНЧАРОВ&#x27;,genre:&#x27;Романы&#x27;,year:&#x27;1859&#x27;,size:&#x27;2,1&#x27;,bg:&#x27;#8d5545&#x27;,ink:&#x27;#f7e4c8&#x27;,summary:&#x27;Тихая жизнь Ильи Ильича сталкивается с деятельным миром Штольца и любовью Ольги. Роман о выборе между мечтой и действием.&#x27;,text:[&#x27;В Гороховой улице, в одном из больших домов, народонаселения которого стало бы на целый уездный город, лежал утром в постели, на своей квартире, Илья Ильич Обломов.&#x27;,&#x27;Это был человек лет тридцати двух-трёх от роду, среднего роста, приятной наружности, с тёмно-серыми глазами, но с отсутствием всякой определённой идеи.&#x27;]},
    {id:&#x27;onegin&#x27;,title:&#x27;Евгений Онегин&#x27;,author:&#x27;Александр Пушкин&#x27;,coverAuthor:&#x27;АЛЕКСАНДР\nПУШКИН&#x27;,genre:&#x27;Поэзия&#x27;,year:&#x27;1833&#x27;,size:&#x27;0,9&#x27;,bg:&#x27;#444f69&#x27;,ink:&#x27;#efdfbd&#x27;,summary:&#x27;Роман в стихах о встречах, письмах и несовпадении чувств. Онегин, Татьяна и портрет целой эпохи.&#x27;,text:[&#x27;«Мой дядя самых честных правил,\nКогда не в шутку занемог,\nОн уважать себя заставил\nИ лучше выдумать не мог.&#x27;,&#x27;Его пример другим наука;\nНо, боже мой, какая скука\nС больным сидеть и день и ночь,\nНе отходя ни шагу прочь!»&#x27;]},
    {id:&#x27;souls&#x27;,title:&#x27;Мёртвые души&#x27;,author:&#x27;Николай Гоголь&#x27;,coverAuthor:&#x27;НИКОЛАЙ\nГОГОЛЬ&#x27;,genre:&#x27;Романы&#x27;,year:&#x27;1842&#x27;,size:&#x27;1,6&#x27;,bg:&#x27;#b3ab81&#x27;,ink:&#x27;#343a28&#x27;,summary:&#x27;Павел Иванович Чичиков приезжает в губернский город с необычным деловым предложением. За чередой встреч возникает живой портрет России.&#x27;,text:[&#x27;В ворота гостиницы губернского города NN въехала довольно красивая рессорная небольшая бричка, в какой ездят холостяки.&#x27;,&#x27;В бричке сидел господин, не красавец, но и не дурной наружности, ни слишком толст, ни слишком тонок; нельзя сказать, чтобы стар, однако ж и не так чтобы слишком молод.&#x27;]}
  ];
  const icon = name =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const escape = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const cover = (book) =&gt; `&lt;div class=&quot;lr-cover&quot; style=&quot;--cover-bg:${book.bg};--cover-ink:${book.ink}&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;lr-cover-author&quot;&gt;${escape(book.coverAuthor).replace(/\n/g,&#x27;&lt;br&gt;&#x27;)}&lt;/span&gt;&lt;span class=&quot;lr-cover-title&quot;&gt;${escape(book.title)}&lt;/span&gt;&lt;span class=&quot;lr-cover-mark&quot;&gt;Библиотека&lt;/span&gt;&lt;/div&gt;`;
  const instances=[];
  function createApp(id, compact) {
    const el=document.getElementById(id);
    const state={tab:&#x27;catalog&#x27;,screen:&#x27;main&#x27;,book:&#x27;nights&#x27;,query:&#x27;&#x27;,genre:&#x27;Все&#x27;,format:&#x27;EPUB&#x27;,local:[&#x27;onegin&#x27;],localFormats:{onegin:&#x27;EPUB&#x27;},favorite:[],queue:{},source:&#x27;Автоматически&#x27;,sort:&#x27;name&#x27;,filter:&#x27;Все&#x27;,toast:&#x27;&#x27;,readerSize:19,readerTheme:&#x27;light&#x27;,theme:&#x27;system&#x27;,density:&#x27;comfortable&#x27;,offline:false};
    let toastTimer;
    const downloadTimers=new Map();
    function saved() { try { return window.openai?.widgetState?.privateContent?.[id]; } catch {return null;} }
    function restore(data) {
      if (!data || typeof data!==&#x27;object&#x27;) return;
      if ([&#x27;catalog&#x27;,&#x27;reading&#x27;,&#x27;library&#x27;,&#x27;more&#x27;].includes(data.tab)) state.tab=data.tab;
      if (Array.isArray(data.local)) state.local=[...new Set([&#x27;onegin&#x27;,...data.local.filter(x=&gt;books.some(b=&gt;b.id===x))])];
      if (data.localFormats &amp;&amp; typeof data.localFormats===&#x27;object&#x27;) state.local.forEach(id=&gt;{if([&#x27;EPUB&#x27;,&#x27;FB2&#x27;,&#x27;PDF&#x27;].includes(data.localFormats[id]))state.localFormats[id]=data.localFormats[id];});
      if (Array.isArray(data.favorite)) state.favorite=data.favorite.filter(x=&gt;books.some(b=&gt;b.id===x));
      if ([&#x27;system&#x27;,&#x27;light&#x27;,&#x27;dark&#x27;].includes(data.theme)) state.theme=data.theme;
    }
    restore(saved());
    function persist(){
      const privateContent={};instances.forEach(app=&gt;privateContent[app.id]={tab:app.state.tab,local:app.state.local,localFormats:app.state.localFormats,favorite:app.state.favorite,theme:app.state.theme});
      try {window.openai?.setWidgetState?.({modelContent:{prototype:&#x27;Librera catalog redesign&#x27;,localBooks:state.local.length,favorites:state.favorite.length},privateContent})?.catch(()=&gt;{});}catch{}
    }
    function notify(message){state.toast=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=&gt;{state.toast=&#x27;&#x27;;render();},3500);}
    function activeCount(){return Object.values(state.queue).filter(x=&gt;x.status!==&#x27;done&#x27;&amp;&amp;x.status!==&#x27;cancelled&#x27;).length;}
    function top(title,eyebrow=&#x27;LIBRERA&#x27;){return `&lt;div class=&quot;lr-top&quot;&gt;&lt;div&gt;&lt;div class=&quot;lr-eyebrow&quot;&gt;${eyebrow}&lt;/div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;/div&gt;&lt;button class=&quot;lr-iconbutton&quot; data-action=&quot;downloads&quot; aria-label=&quot;Загрузки&quot;&gt;${icon(&#x27;download&#x27;)}${activeCount()?`&lt;span class=&quot;lr-count&quot;&gt;${activeCount()}&lt;/span&gt;`:&#x27;&#x27;}&lt;/button&gt;&lt;/div&gt;`;}
    function back(label=&#x27;Каталог&#x27;){return `&lt;div class=&quot;lr-backrow&quot;&gt;&lt;button class=&quot;lr-back&quot; data-action=&quot;back&quot;&gt;${icon(&#x27;arrow-left&#x27;)}${label}&lt;/button&gt;${state.screen===&#x27;detail&#x27;?`&lt;button class=&quot;lr-iconbutton&quot; data-action=&quot;favorite&quot; data-active=&quot;${state.favorite.includes(state.book)}&quot; aria-pressed=&quot;${state.favorite.includes(state.book)}&quot; aria-label=&quot;${state.favorite.includes(state.book)?&#x27;Убрать из избранного&#x27;:&#x27;В избранное&#x27;}&quot;&gt;${icon(&#x27;bookmark&#x27;)}&lt;/button&gt;`:&#x27;&#x27;}&lt;/div&gt;`;}
    function entry(book){return `&lt;button class=&quot;lr-book&quot; data-book=&quot;${book.id}&quot; aria-label=&quot;${escape(book.title)}, ${escape(book.author)}&quot;&gt;${cover(book)}&lt;span class=&quot;lr-book-name&quot;&gt;${escape(book.title)}&lt;/span&gt;&lt;span class=&quot;lr-book-author&quot;&gt;${escape(book.author)}&lt;/span&gt;&lt;span class=&quot;lr-book-meta&quot;&gt;${state.local.includes(book.id)?&#x27;НА УСТРОЙСТВЕ&#x27;:&#x27;EPUB · FB2 · PDF&#x27;}&lt;/span&gt;&lt;/button&gt;`;}
    function row(book,local=false){return `&lt;div class=&quot;lr-row&quot;&gt;${cover(book)}&lt;button class=&quot;lr-row-main&quot; data-book=&quot;${book.id}&quot;&gt;&lt;span class=&quot;lr-book-name&quot;&gt;${escape(book.title)}&lt;/span&gt;&lt;span class=&quot;lr-book-author&quot;&gt;${escape(book.author)}&lt;/span&gt;&lt;span class=&quot;lr-book-meta&quot;&gt;${local?&#x27;На устройстве · &#x27;+(state.localFormats[book.id]||&#x27;EPUB&#x27;):book.genre+&#x27; · &#x27;+book.year}&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;lr-iconbutton&quot; data-book=&quot;${book.id}&quot; aria-label=&quot;${local?&#x27;Открыть&#x27;:&#x27;Подробнее&#x27;}: ${escape(book.title)}&quot;&gt;${icon(local?&#x27;book-open&#x27;:&#x27;chevron-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`;}
    function catalog(){
      let list=books.filter(b=&gt;(state.genre===&#x27;Все&#x27;||b.genre===state.genre)&amp;&amp;(!state.query||(b.title+&#x27; &#x27;+b.author).toLocaleLowerCase(&#x27;ru&#x27;).includes(state.query.toLocaleLowerCase(&#x27;ru&#x27;))));
      if(!compact&amp;&amp;!state.query&amp;&amp;state.genre===&#x27;Все&#x27;)list=list.slice(0,4);
      if(compact&amp;&amp;state.sort===&#x27;name&#x27;)list.sort((a,b)=&gt;a.title.localeCompare(b.title,&#x27;ru&#x27;));
      if(compact&amp;&amp;state.sort===&#x27;author&#x27;)list.sort((a,b)=&gt;a.author.localeCompare(b.author,&#x27;ru&#x27;));
