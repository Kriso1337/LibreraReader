<script>

    {id:'nights',title:'Белые ночи',author:'Фёдор Достоевский',coverAuthor:'ФЁДОР\nДОСТОЕВСКИЙ',genre:'Романы',year:'1848',size:'0,8',bg:'#294938',ink:'#e9e4c9',summary:'Четыре петербургские ночи, случайная встреча и история мечтателя, который впервые решается выйти из своего одиночества.',text:['Была чудная ночь, такая ночь, которая разве только и может быть тогда, когда мы молоды, любезный читатель.','Небо было такое звёздное, такое светлое небо, что, взглянув на него, невольно нужно было спросить себя: неужели же могут жить под таким небом разные сердитые и капризные люди?']},
    {id:'captain',title:'Капитанская дочка',author:'Александр Пушкин',coverAuthor:'АЛЕКСАНДР\nПУШКИН',genre:'Романы',year:'1836',size:'1,2',bg:'#d9b78c',ink:'#443e30',summary:'Пётр Гринёв отправляется на службу в далёкую крепость. История взросления, любви и верности себе на фоне большого восстания.',text:['Отец мой Андрей Петрович Гринёв в молодости своей служил при графе Минихе и вышел в отставку премьер-майором в 17… году.','С тех пор жил он в своей Симбирской деревне, где и женился на девице Авдотье Васильевне Ю., дочери бедного тамошнего дворянина.']},
    {id:'ward',title:'Палата № 6',author:'Антон Чехов',coverAuthor:'АНТОН\nЧЕХОВ',genre:'Рассказы',year:'1892',size:'0,4',bg:'#b3c4c1',ink:'#243c3c',summary:'Врач Андрей Ефимыч находит собеседника там, где меньше всего ожидал. Небольшая повесть о достоинстве, равнодушии и границах свободы.',text:['В больничном дворе стоит небольшой флигель, окружённый целым лесом репейника, крапивы и дикой конопли.','Крыша на нём ржавая, труба наполовину обвалилась, ступеньки у крыльца сгнили и поросли травой, а от штукатурки остались только следы.']},

  ];
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cover = (book) => `<div class="lr-cover" style="--cover-bg:${book.bg};--cover-ink:${book.ink}" aria-hidden="true"><span class="lr-cover-author">${escape(book.coverAuthor).replace(/\n/g,'<br>')}</span><span class="lr-cover-title">${escape(book.title)}</span><span class="lr-cover-mark">Библиотека</span></div>`;
  const instances=[];
  function createApp(id, compact) {

    let toastTimer;

      if (data.localFormats && typeof data.localFormats==='object') state.local.forEach(id=>{if(['EPUB','FB2','PDF'].includes(data.localFormats[id]))state.localFormats[id]=data.localFormats[id];});
      if (Array.isArray(data.favorite)) state.favorite=data.favorite.filter(x=>books.some(b=>b.id===x));

    restore(saved());
    function persist(){
      const privateContent={};instances.forEach(app=>privateContent[app.id]={tab:app.state.tab,local:app.state.local,localFormats:app.state.localFormats,favorite:app.state.favorite,theme:app.state.theme});

    function row(book,local=false){return `<div class="lr-row">${cover(book)}<button class="lr-row-main" data-book="${book.id}"><span class="lr-book-name">${escape(book.title)}</span><span class="lr-book-author">${escape(book.author)}</span><span class="lr-book-meta">${local?'На устройстве · '+(state.localFormats[book.id]||'EPUB'):book.genre+' · '+book.year}</span></button><button class="lr-iconbutton" data-book="${book.id}" aria-label="${local?'Открыть':'Подробнее'}: ${escape(book.title)}">${icon(local?'book-open':'chevron-right')}</button></div>`;}
    function catalog(){

    }
    function detail(){const b=books.find(x=>x.id===state.book),q=state.queue[b.id],local=state.local.includes(b.id);return `${back(state.tab==='library'?'Мои книги':'Каталог')}<div class="lr-detail-cover">${cover(b)}</div><h1 class="lr-detail-title">${b.title}</h1><p class="lr-detail-author">${b.author}</p><p class="lr-summary">${b.summary}</p>${!local?`<span class="lr-label">Формат книги</span><div class="lr-formats">${['EPUB','FB2','PDF'].map((f,i)=>`<button class="lr-format" data-format="${f}" aria-pressed="${state.format===f}"><strong>${f}</strong><small>${i===2?'3,2':b.size} МБ</small></button>`).join('')}</div>`:`<div class="lr-notice"><strong>Книга уже у вас</strong>Можно читать без подключения к интернету.</div>`}${q&&q.status!=='done'&&q.status!=='cancelled'?`<div class="lr-track" role="progressbar" aria-label="Загрузка книги" aria-valuenow="${q.progress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${q.progress}%"></span></div><div class="lr-caption"><span>${q.status==='paused'?'Приостановлено':state.offline?'Ожидание сети':'Скачивание'}</span><span>${q.progress}%</span></div><button class="lr-primary" data-action="downloads" style="margin-top:16px">Открыть загрузки</button>`:`<button class="lr-primary" data-action="${local?'read':'download'}">${icon(local?'book-open':'download')}${local?'Читать книгу':'Скачать '+state.format}</button>`}<p class="lr-location">${icon('folder')}На устройстве · Книги / Librera</p>`;}
    function library(){const list=books.filter(b=>state.filter==='Избранное'?state.favorite.includes(b.id):state.local.includes(b.id));return `${top('Мои книги')}<p class="lr-sub" style="margin:-7px 0 20px">Ваша библиотека всегда рядом</p><div class="lr-chips">${['Все','Избранное'].map(f=>`<button class="lr-chip" data-filter="${f}" aria-pressed="${state.filter===f}">${f}</button>`).join('')}</div>${list.length?list.map(b=>row(b,state.local.includes(b.id))).join(''):`<div class="lr-empty">${icon('bookmark')}<h2>Здесь будет любимое</h2><p>Добавьте книгу в избранное<br>из её карточки.</p><button class="lr-secondary" data-tab="catalog" style="margin:auto">Выбрать книгу</button></div>`}`;}
    function reading(){const b=books.find(x=>x.id===state.local[state.local.length-1]);return `${top('Читаю')}<p class="lr-sub" style="margin:-7px 0 24px">Немного времени для хорошей истории</p><div class="lr-continue"><div class="lr-eyebrow" style="margin-bottom:15px">ПРОДОЛЖИТЬ ЧТЕНИЕ</div><div class="lr-continue-top">${cover(b)}<div><h2>${b.title}</h2><p>${b.author}</p><div class="lr-track"><span style="width:32%"></span></div><div class="lr-caption"><span>Глава первая</span><span>32%</span></div></div></div><button class="lr-primary" data-read="${b.id}">${icon('book-open')}Продолжить</button></div><div class="lr-section-title"><h2>В вашей библиотеке</h2><span>${state.local.length}</span></div>${books.filter(x=>state.local.includes(x.id)).slice(0,3).map(x=>row(x,true)).join('')}<button class="lr-textbutton" data-tab="catalog" style="margin-top:20px">Найти следующую книгу →</button>`;}
    function downloads(){const entries=Object.entries(state.queue).filter(([,q])=>q.status!=='cancelled');return `${back('Назад')}<h1 style="margin-bottom:8px">Загрузки</h1><p class="lr-sub" style="margin-bottom:22px">Книги появятся в вашей библиотеке</p>${entries.length?entries.map(([id,q])=>{const b=books.find(x=>x.id===id);return `<div class="lr-row">${cover(b)}<div><span class="lr-book-name">${b.title}</span><span class="lr-book-author">${q.format} · ${q.status==='done'?'На устройстве':q.status==='paused'?'Приостановлено':state.offline?'Ожидание сети':q.progress+'%'}</span>${q.status!=='done'?`<div class="lr-track"><span style="width:${q.progress}%"></span></div><button class="lr-textbutton" data-cancel="${id}">Отменить</button>`:''}</div><button class="lr-iconbutton" ${q.status==='done'?`data-read="${id}"`:`data-pause="${id}"`} aria-label="${q.status==='done'?'Читать':q.status==='paused'?'Возобновить':'Приостановить'}: ${b.title}">${icon(q.status==='done'?'book-open':q.status==='paused'?'play':'pause')}</button></div>`;}).join(''):`<div class="lr-empty">${icon('download')}<h2>Пока ничего не скачивается</h2><p>Выберите книгу и удобный формат.<br>Здесь появится ход загрузки.</p><button class="lr-secondary" data-tab="catalog" style="margin:auto">Открыть каталог</button></div>`}<p class="lr-location" style="margin-top:25px">${icon('folder')}Книги / Librera</p>`;}
    function source(){return `${back('Каталог')}<h1>Источник книг</h1><p class="lr-sub" style="margin-bottom:22px">Флибуста</p><div class="lr-notice"><strong>${state.offline?'Не удалось подключиться':'Соединение установлено'}</strong>${state.offline?'Можно попробовать другой адрес.':'Librera выбирает доступный адрес автоматически.'}</div>${['Автоматически','flibusta.is','proxy.flibusta.is','flibusta.site'].map(s=>`<button class="lr-setting" data-source="${s}">${icon(s==='Автоматически'?'shuffle':'globe')}<span class="lr-setting-label">${s}<small>${s==='Автоматически'?'Рекомендуется':'Использовать этот адрес'}</small></span>${state.source===s?`<span class="lr-selected-mark">${icon('check')}</span>`:''}</button>`).join('')}<button class="lr-secondary" data-action="retry" style="margin-top:24px;width:100%">${icon('refresh-cw')}Проверить соединение</button>`;}
    function more(){return `${top('Ещё')}<p class="lr-sub" style="margin:-7px 0 22px">Всё для вашего способа читать</p><button class="lr-setting" data-action="source">${icon('globe')}<span class="lr-setting-label">Онлайн-каталоги<small>Флибуста · ${state.source}</small></span>${icon('chevron-right')}</button><button class="lr-setting" data-action="downloads">${icon('download')}<span class="lr-setting-label">Загрузки<small>Книги / Librera</small></span>${icon('chevron-right')}</button><button class="lr-setting" data-action="theme">${icon('sun-moon')}<span class="lr-setting-label">Оформление<small>${state.theme==='system'?'Как в системе':state.theme==='light'?'Светлое':'Тёмное'}</small></span>${icon('chevron-right')}</button><button class="lr-setting" data-action="offline">${icon(state.offline?'wifi-off':'wifi')}<span class="lr-setting-label">Режим офлайн<small>${state.offline?'Включён · только сохранённые книги':'Выключен'}</small></span>${icon('chevron-right')}</button><button class="lr-setting" data-action="tools">${icon('sliders-horizontal')}<span class="lr-setting-label">Настройки чтения<small>Шрифт, тема и размер текста</small></span>${icon('chevron-right')}</button>`;}
    function reader(){const b=books.find(x=>x.id===state.book);return `${back('Мои книги')}<div class="lr-reader" style="--lr-reader-size:${state.readerSize}px;color-scheme:${state.readerTheme}"><p class="lr-reader-chapter">${b.author}</p><h2>${b.title}</h2><div class="lr-reader-text">${b.text.map(p=>`<p>${escape(p).replace(/\n/g,'<br>')}</p>`).join('')}</div><div class="lr-reader-tools"><button data-font="-1" aria-label="Уменьшить шрифт">A−</button><button data-action="reader-theme" aria-label="Сменить тему чтения">${icon('sun-moon')}</button><button data-font="1" aria-label="Увеличить шрифт">A+</button><button data-action="reader-bookmark" aria-label="Добавить закладку">${icon('bookmark')}</button></div><p class="lr-pages">Начало книги · ${state.readerSize} px</p></div>`;}
    function render(options={}){
      const current=el.querySelector('[data-search]'),focusSearch=options.search&&current===document.activeElement,position=focusSearch?current.selectionStart:null;
      el.style.colorScheme=state.theme==='system'?'light dark':state.theme;
      el.dataset.density=state.density;
      let body=state.screen==='detail'?detail():state.screen==='downloads'?downloads():state.screen==='source'?source():state.screen==='reader'?reader():state.tab==='catalog'?catalog():state.tab==='library'?library():state.tab==='reading'?reading():more();
      el.innerHTML=`<div class="lr-status"><span>9:41</span><span class="lr-status-right">${icon('signal')}${icon(state.offline?'wifi-off':'wifi')}${icon('battery-full')}</span></div><main class="lr-main ${compact?'lr-compact':''}">${body}</main>${state.toast?`<div class="lr-toast" role="status">${state.toast}</div>`:''}${state.screen==='reader'?'':`<nav class="lr-nav" aria-label="Разделы Librera">${[['reading','book-open','Читаю'],['library','library-big','Мои книги'],['catalog','compass','Каталог'],['more','menu','Ещё']].map(([tab,ic,label])=>`<button data-tab="${tab}" ${state.tab===tab?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav>`}<span class="lr-sr" aria-live="polite">${state.screen==='downloads'?activeCount()+' активных загрузок':''}</span>`;
      el.querySelectorAll('button').forEach(button=>button.classList.add('cursor-interaction'));
      if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});
      if(focusSearch){const input=el.querySelector('[data-search]');input.focus();try{input.setSelectionRange(position,position);}catch{}}
    }
    function startDownload(){
      const id=state.book;
      if(state.local.includes(id))return;
      const existing=state.queue[id];if(existing&&existing.status!=='cancelled')return;
      clearInterval(downloadTimers.get(id));
      state.queue[id]={progress:0,status:'running',format:state.format};
      const job=state.queue[id];
      const timer=setInterval(()=>{
        const q=state.queue[id];if(!q||q!==job||q.status==='cancelled'){clearInterval(timer);return;}

        q.progress=Math.min(100,q.progress+10);
        if(q.progress===100){q.status='done';state.local.push(id);state.localFormats[id]=q.format;clearInterval(timer);downloadTimers.delete(id);notify('Книга сохранена в «Мои книги»');persist();}
        render();
      },400);
      downloadTimers.set(id,timer);
    }
    el.addEventListener('input',event=>{if(event.target.matches('[data-search]')){state.query=event.target.value;render({search:true});}});
    el.addEventListener('change',event=>{if(event.target.matches('[data-sort]')){state.sort=event.target.value;render();}});
    el.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!el.contains(button))return;
      const d=button.dataset;
      if(d.tab){state.tab=d.tab;state.screen='main';state.toast='';}
      if(d.book){state.book=d.book;state.screen='detail';state.format='EPUB';}
      if(d.read){state.book=d.read;state.screen='reader';}
      if(d.genre){state.genre=d.genre;}
      if(d.filter){state.filter=d.filter;}
      if(d.format){state.format=d.format;}
      if(d.source){state.source=d.source;notify('Адрес выбран: '+d.source);}
      if(d.pause){const q=state.queue[d.pause];q.status=q.status==='paused'?'running':'paused';}
      if(d.cancel){state.queue[d.cancel].status='cancelled';clearInterval(downloadTimers.get(d.cancel));downloadTimers.delete(d.cancel);notify('Загрузка отменена');}
      if(d.font){state.readerSize=Math.max(16,Math.min(25,state.readerSize+Number(d.font)));}
      switch(d.action){
        case 'downloads':state.screen='downloads';break;
        case 'source':state.screen='source';break;
        case 'back':state.screen='main';break;
        case 'clear-search':state.query='';state.genre='Все';break;
        case 'favorite':state.favorite=state.favorite.includes(state.book)?state.favorite.filter(x=>x!==state.book):[...state.favorite,state.book];notify(state.favorite.includes(state.book)?'Добавлено в избранное':'Убрано из избранного');break;
        case 'download':startDownload();break;
        case 'read':state.screen='reader';break;
        case 'retry':state.offline=false;notify('Соединение восстановлено');break;
        case 'offline':state.offline=!state.offline;break;
        case 'theme':state.theme=state.theme==='system'?'light':state.theme==='light'?'dark':'system';break;
        case 'reader-theme':state.readerTheme=state.readerTheme==='dark'?'light':'dark';break;
        case 'reader-bookmark':notify('Закладка добавлена');break;
        case 'tools':state.book=state.local[state.local.length-1];state.screen='reader';break;
      }
      render();persist();
    });
    const app={id,state,render,restore};instances.push(app);render();
    if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:el,onChange:render});tweak.addSelect(state,'theme',{label:'Тема',options:[{label:'Системная',value:'system'},{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}]});tweak.addSelect(state,'density',{label:'Плотность',options:[{label:'Свободная',value:'comfortable'},{label:'Компактная',value:'compact'}]});tweak.addToggle(state,'offline',{label:'Нет соединения'});}
    return app;
  }
  createApp('lr-shelf',false);createApp('lr-compact',true);
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved)instances.forEach(app=>{app.restore(saved[app.id]);app.render();});});
})();
</script>
